<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Receipt DIVA Laundry</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/css/diva.css">
</head>
<body class="bg-body-tertiary">
  <main class="receipt-wrap mx-auto px-3 py-4">

    <!-- Shown while loading and when something goes wrong -->
    <div id="status" class="text-center text-secondary py-5" role="status">Memuat receipt…</div>

    <!-- Filled in by assets/js/receipt.js -->
    <article id="receipt" class="card shadow-sm d-none">
      <div class="card-body">
        <header class="text-center mb-3">
          <h1 class="h4 mb-1" data-field="outletName"></h1>
          <div class="small text-secondary" data-field="outletAddress"></div>
          <div class="small text-secondary" data-field="outletPhone"></div>
        </header>

        <!-- One row per label + value (label left, value right). Hiding an optional row
             (data-show) takes its label and value away together. -->
        <dl class="receipt-meta small mb-3">
          <div><dt>No. Order</dt><dd data-field="orderNumber" class="fw-semibold"></dd></div>
          <div><dt>Tanggal</dt><dd data-field="createdAt"></dd></div>
          <div data-show="dueDate"><dt>Selesai</dt><dd data-field="dueDate"></dd></div>
          <div><dt>Customer</dt><dd data-field="customerName"></dd></div>
          <div><dt>Telp</dt><dd data-field="customerPhone"></dd></div>
        </dl>

        <ul id="items" class="list-unstyled border-top border-bottom py-2 mb-2"></ul>

        <div class="d-flex justify-content-between align-items-baseline">
          <span class="fw-bold">TOTAL</span>
          <span class="fs-4 fw-bold" data-field="total"></span>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-2">
          <span id="payment" class="badge"></span>
          <span class="small text-secondary">Status: <span data-field="status"></span></span>
        </div>

        <p class="small mt-3 mb-0" data-show="notes">Catatan: <span data-field="notes"></span></p>
        <p class="small text-center fst-italic text-secondary mt-3 mb-0" data-field="footer"></p>
      </div>

      <div class="card-footer bg-transparent d-grid gap-2">
        <a id="pdf" class="btn btn-primary" href="#">Unduh PDF</a>
        <div class="d-flex gap-2">
          <button id="copy" type="button" class="btn btn-outline-secondary flex-fill">Salin link</button>
          <button id="share" type="button" class="btn btn-outline-success flex-fill">Bagikan</button>
        </div>
      </div>
    </article>
  </main>

  <script type="module" src="/assets/js/receipt.js"></script>
</body>
</html>
