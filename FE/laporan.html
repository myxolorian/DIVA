<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Laporan · DIVA Laundry</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/diva.css">
  <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
  <script type="module" src="/assets/js/pages/report.js"></script>
</head>
<body>
  <main class="app-main">
    <header class="page-header">
      <h1 class="flex-grow-1">Laporan pemasukan</h1>
    </header>
    <div class="chips mb-2" id="periods" role="group" aria-label="Pilih periode"></div>
    <form class="card-soft p-3 mb-2 d-none" id="custom" novalidate>
      <div class="row g-2 align-items-end">
        <div class="col-6 col-md-4">
          <label class="form-label" for="from">Dari</label>
          <input class="form-control" id="from" name="from" type="date" required>
        </div>
        <div class="col-6 col-md-4">
          <label class="form-label" for="to">Sampai</label>
          <input class="form-control" id="to" name="to" type="date" required>
        </div>
        <div class="col-12 col-md-4 d-grid">
          <button class="btn btn-primary" type="submit">Tampilkan</button>
        </div>
      </div>
      <div class="invalid-feedback d-block small mt-2" id="custom-error"></div>
    </form>
    <p class="small muted mb-3" id="period-label"></p>
    <div id="content" aria-live="polite"></div>
  </main>
</body>
</html>
