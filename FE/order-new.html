<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Buat Order · DIVA Laundry</title>
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/assets/css/diva.css">

<body>
  <main class="app-main has-action-bar">
    <header class="page-header">
      <button class="back" id="back" type="button" aria-label="Kembali"><i class="bi bi-arrow-left"></i></button>
      <h1 class="flex-grow-1">Buat Order</h1>

    <div class="inner">
      <div class="flex-grow-1 min-w-0">
        <div class="total-label" id="action-label">Total</div>
        <div class="total num" id="action-total">Rp 0</div>
      </div>
      <button class="btn btn-primary btn-lg px-4" id="action-button" type="button">Lanjut</button>
    </div>
  </div>
